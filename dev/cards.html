<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DODEKATHLOS — card art contact sheet</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; background: #0b0c12; color: #cfc6b0; font: 12px/1.3 'Marcellus', Georgia, serif; }
    body { padding: 14px 16px 40px; }
    h2 { font: 700 13px 'Cinzel', serif; letter-spacing: 0.18em; color: #d9b45a; margin: 14px 0 8px; text-transform: uppercase; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }
    .card { display: block; border-radius: 7% / 5%; box-shadow: 0 6px 16px rgba(0,0,0,0.55); }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .lbl { font-size: 10px; color: #8d8574; text-align: center; max-width: 140px; }
    .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
    .ic { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; background: #14161f; border-radius: 6px; }
    .ic .pair { display: flex; align-items: center; gap: 8px; }
    .ic.light { background: #efe6d2; color: #3b2f1e; }
    .ic .name { font-size: 10px; color: #a59c88; }
    .ic.light .name { color: #5b4a30; }
    .hand { position: relative; height: 260px; margin: 4px 0 6px; }
    .hand canvas { position: absolute; top: 20px; border-radius: 7% / 5%; box-shadow: -4px 4px 14px rgba(0,0,0,0.6); transform-origin: 50% 120%; }
    .table { display: inline-block; vertical-align: top; margin: 0 10px 10px 0; background: radial-gradient(ellipse at 50% 40%, #1b2630 0%, #0c1015 70%); padding: 6px 14px; border-radius: 12px; }
    #stats { position: fixed; right: 10px; top: 6px; font: 11px monospace; color: #7f7; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="stats"></div>
  <script type="module" src="./cards.ts"></script>
</body>
</html>
